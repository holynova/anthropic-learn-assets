<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Anthropic Learn Assets — 图标与色板素材库</title>
  <desc id="desc">米白底标题：Anthropic Learn Assets，29 枚手绘风 SVG 图标与完整色板；右侧是 Slate 20 阶灰度条与 8 个强调色圆点。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf9f5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5e5d59">DESIGN ASSETS · 提取自 ANTHROPIC LEARN</text>
    <text x="56" y="126" font-size="56" font-weight="700" fill="#141413">Anthropic Learn</text>
    <text x="56" y="168" font-size="23" fill="#b4532f">29 枚手绘风 SVG 图标 + 完整色板</text>
    <text x="56" y="204" font-size="19" fill="#5e5d59">Slate 20 阶灰、11 强调色、6 种导出格式。</text>
    <g id="chips" font-size="18" fill="#141413" text-anchor="middle">
      <g><rect x="56" y="238" width="144" height="36" rx="18" fill="#f0eee6" stroke="#d1cfc5" stroke-width="1.5"/><text x="128" y="262">29 SVG 图标</text></g>
      <g><rect x="212" y="238" width="144" height="36" rx="18" fill="#f0eee6" stroke="#d1cfc5" stroke-width="1.5"/><text x="284" y="262">Slate 20 阶</text></g>
      <g><rect x="368" y="238" width="162" height="36" rx="18" fill="#f0eee6" stroke="#d1cfc5" stroke-width="1.5"/><text x="449" y="262">6 种导出格式</text></g>
      <g><rect x="542" y="238" width="144" height="36" rx="18" fill="#f0eee6" stroke="#d1cfc5" stroke-width="1.5"/><text x="614" y="262">8 套字体变量</text></g>
    </g>
  </g>

  <g id="palette-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="760" y="46" font-size="18" fill="#5e5d59">Slate Scale · 20 阶中性灰</text>
    <g id="slate-strip">
      <rect x="760" y="62" width="18" height="44" rx="4" fill="#faf9f5" stroke="#d1cfc5" stroke-width="1"/>
      <rect x="780" y="62" width="18" height="44" rx="4" fill="#f5f4ed"/>
      <rect x="800" y="62" width="18" height="44" rx="4" fill="#f0eee6"/>
      <rect x="820" y="62" width="18" height="44" rx="4" fill="#e8e6dc"/>
      <rect x="840" y="62" width="18" height="44" rx="4" fill="#dedcd1"/>
      <rect x="860" y="62" width="18" height="44" rx="4" fill="#d1cfc5"/>
      <rect x="880" y="62" width="18" height="44" rx="4" fill="#c2c0b6"/>
      <rect x="900" y="62" width="18" height="44" rx="4" fill="#b0aea5"/>
      <rect x="920" y="62" width="18" height="44" rx="4" fill="#9c9a92"/>
      <rect x="940" y="62" width="18" height="44" rx="4" fill="#87867f"/>
      <rect x="960" y="62" width="18" height="44" rx="4" fill="#73726c"/>
      <rect x="980" y="62" width="18" height="44" rx="4" fill="#5e5d59"/>
      <rect x="1000" y="62" width="18" height="44" rx="4" fill="#4d4c48"/>
      <rect x="1020" y="62" width="18" height="44" rx="4" fill="#3d3d3a"/>
      <rect x="1040" y="62" width="18" height="44" rx="4" fill="#30302e"/>
      <rect x="1060" y="62" width="18" height="44" rx="4" fill="#262624"/>
      <rect x="1080" y="62" width="18" height="44" rx="4" fill="#1f1e1d"/>
      <rect x="1100" y="62" width="18" height="44" rx="4" fill="#1a1918"/>
      <rect x="1120" y="62" width="18" height="44" rx="4" fill="#141413"/>
      <rect x="1140" y="62" width="18" height="44" rx="4" fill="#0f0f0e"/>
    </g>
    <text x="760" y="132" font-size="18" fill="#5e5d59">slate-050 #faf9f5</text>
    <text x="1158" y="132" font-size="18" fill="#5e5d59" text-anchor="end">slate-1000 #0f0f0e</text>

    <text x="760" y="182" font-size="18" fill="#5e5d59">Accent · 11 个强调色</text>
    <g id="accent-dots">
      <circle cx="776" cy="212" r="15" fill="#d97757"/><circle cx="824" cy="212" r="15" fill="#c46686"/><circle cx="872" cy="212" r="15" fill="#6a9bcc"/><circle cx="920" cy="212" r="15" fill="#788c5d"/><circle cx="968" cy="212" r="15" fill="#bcd1ca"/><circle cx="1016" cy="212" r="15" fill="#cbcadb"/><circle cx="1064" cy="212" r="15" fill="#ebcece"/><circle cx="1112" cy="212" r="15" fill="#e3dacc"/>
    </g>
    <text x="760" y="252" font-size="18" fill="#5e5d59">clay · fig · sky · olive · cactus · heather · coral · oat</text>

    <g id="nodes-motif" stroke="#141413" stroke-width="2.5" fill="#faf9f5">
      <line x1="776" y1="300" x2="872" y2="300"/><line x1="776" y1="300" x2="776" y2="330"/><line x1="872" y1="300" x2="872" y2="330"/><line x1="776" y1="330" x2="872" y2="330"/>
      <circle cx="776" cy="300" r="8"/><circle cx="872" cy="300" r="8"/><circle cx="776" cy="330" r="8"/><circle cx="872" cy="330" r="8"/>
    </g>
    <text x="900" y="322" font-size="18" fill="#5e5d59">29 icons · 手绘剪影风</text>
  </g>
</svg>
